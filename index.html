<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b63"><title>UPSC Companion</title>
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
<aside class="sidebar">
  <div class="brand"><div class="brand-icon">✦</div><div><b>UPSC Companion</b><small>Your study space</small></div></div>
  <nav id="nav">
    <button class="nav-btn active" data-view="home">⌂ <span>Dashboard</span></button>
    <button class="nav-btn" data-view="notes">▤ <span>Notes maker</span></button>
    <button class="nav-btn" data-view="reader">☷ <span>Scroll reader</span></button>
    <button class="nav-btn" data-view="revision">↻ <span>Revision</span></button>
    <button class="nav-btn" data-view="planner">▦ <span>Study planner</span></button>
    <button class="nav-btn" data-view="practice">✓ <span>Practice</span></button>
    <button class="nav-btn" data-view="pdf">⇧ <span>PDF library</span></button>
  </nav>
  <div class="sidebar-foot"><span class="status-dot"></span> Offline-ready <small>Your data stays in this browser</small></div>
</aside>
<main class="main">
<header class="topbar"><button id="mobileMenu" class="icon-btn" aria-label="Toggle menu">☰</button><div><p class="eyebrow">YOUR PERSONAL UPSC WORKSPACE</p><h1 id="pageTitle">Dashboard</h1></div><div class="top-actions"><span class="today" id="today"></span><button class="primary" id="quickNote">＋ New note</button></div></header>
<section id="view" aria-live="polite"></section>
<footer>UPSC Companion · Local-first study workspace <span>Export backups regularly to keep your data safe.</span></footer>
</main>
</div>
<input id="fileInput" type="file" accept=".pdf,application/pdf" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="app.js"></script>
</body></html>
